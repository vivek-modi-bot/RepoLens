services:
  repo-review-api:
    build: .
    container_name: repolens-api
    ports:
      - "8000:8000"
    environment:
      APP_NAME: RepoLens
      DEBUG: "false"
      LOG_LEVEL: INFO
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-only-change-me-please-32chars}
      JWT_ALGORITHM: HS256
      JWT_EXPIRATION_MINUTES: 60
      DATABASE_URL: sqlite+aiosqlite:///./data/repolens.db
      LLM_PROVIDER: ollama
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5-coder}
      OLLAMA_TIMEOUT_SECONDS: 120
      MAX_FILE_SIZE: 100000
      MAX_FILES: 100
      MAX_REPOSITORY_SIZE: 50000000
      MAX_CHUNK_CHARS: 8000
      TEMP_DIR: /tmp/repolens
    volumes:
      - api-data:/app/data
      - repo-tmp:/tmp/repolens
    depends_on:
      ollama:
        condition: service_started
    networks:
      - repolens-net
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ""
    container_name: repolens-frontend
    ports:
      - "3000:80"
    depends_on:
      - repo-review-api
    networks:
      - repolens-net
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: repolens-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - repolens-net
    restart: unless-stopped

volumes:
  api-data:
  repo-tmp:
  ollama-data:

networks:
  repolens-net:
    driver: bridge
